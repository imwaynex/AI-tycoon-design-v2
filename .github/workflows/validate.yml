name: Validate design sources

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1; verified against the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check specifications, tokens and document structure
        run: python3 scripts/check.py
      - name: Run regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

:root{color-scheme:light;--ink:#263132;--muted:#626e70;--paper:#f8f9f8;--line:#c3cbca;--soft:#e9edeb;--pad:clamp(.5rem,2vw,.875rem);--gap:clamp(.375rem,1.4vw,.75rem);--rail:clamp(3.25rem,13vw,3.75rem);--hud:clamp(3.25rem,7dvh,4rem);--ticker:2.875rem;--social:4.5rem;--nav:clamp(3.5rem,7.5dvh,4rem);--safe-top:max(var(--pad),env(safe-area-inset-top));--safe-right:max(var(--pad),env(safe-area-inset-right));--safe-bottom:max(var(--pad),env(safe-area-inset-bottom));--safe-left:max(var(--pad),env(safe-area-inset-left));--speed:380ms;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:#e9ecec}body{font-size:1rem}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);background:var(--paper)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #417875;outline-offset:2px}button:active{background:#dce4e1}button:hover{border-color:#647875}button:disabled{cursor:default}h1,h2,p{margin:0}svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icons{display:none}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.panel{box-shadow:0 .25rem .75rem #223d2f16;border:1px solid var(--line);border-radius:.75rem;background:var(--paper)}
.app{width:100%;height:100vh;height:100dvh;min-height:34rem;display:grid;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);gap:var(--gap);grid-template-columns:var(--rail) minmax(0,1fr) var(--rail);grid-template-rows:var(--hud) var(--ticker) minmax(0,1fr) var(--social) var(--nav);grid-template-areas:"hud hud hud" "live live live" "secondary map utility" "social social social" "nav nav nav";isolation:isolate}

.secondary{grid-area:secondary}.utility{grid-area:utility}.rail{display:flex;flex-direction:column;align-self:start;gap:var(--gap);z-index:2}.rail button{box-shadow:0 .2rem .5rem #223d2f18;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.25rem;min-height:3.5rem;width:100%;padding:.375rem .125rem;border-radius:.65rem;font-size:.75rem;white-space:nowrap}.rail svg{width:1.25rem;height:1.25rem}.rail button .badge{font-size:.625rem}.live{grid-area:live;z-index:1;overflow:hidden}.ticker{display:flex;width:100%;height:100%;align-items:center;gap:.5rem;padding:0 .625rem;border:0;border-radius:inherit;text-align:left}.live-label{font-size:.75rem;font-weight:750;letter-spacing:.04em;white-space:nowrap}.ticker-copy{font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.ticker-index{font-size:.75rem;color:var(--muted);white-space:nowrap}.events-panel{display:none}.live-heading{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.live-heading h2{font-size:.875rem}.live-heading small{font-size:.75rem;color:var(--muted)}.event-card{display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:clamp(.375rem,1.5dvh,.625rem);text-align:left;border-radius:.5rem;min-height:2.75rem}.event-card strong{font-size:.875rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-meta{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:.25rem}.event-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city-map{grid-area:1/1/-1/-1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--rail);grid-template-rows:var(--hud) var(--ticker) minmax(0,1fr) var(--social) var(--nav);gap:var(--gap);min-height:0;margin:calc(-1 * var(--safe-top)) calc(-1 * var(--safe-right)) calc(-1 * var(--safe-bottom)) calc(-1 * var(--safe-left));padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);background:#dce5df;isolation:isolate;z-index:0}
.map-terrain{grid-area:1/1/-1/-1;margin:calc(-1 * var(--safe-top)) calc(-1 * var(--safe-right)) calc(-1 * var(--safe-bottom)) calc(-1 * var(--safe-left));background-color:#dce5df;background-image:linear-gradient(#a8bcb63b 1px,transparent 1px),linear-gradient(90deg,#a8bcb63b 1px,transparent 1px);background-size:clamp(1.25rem,4vw,2.5rem) clamp(1.25rem,4vw,2.5rem);pointer-events:none;z-index:-1}
.map-stage{grid-area:3/2/4/3;display:grid;min-height:0;container-type:size}
/* Seven equal squares, always 2–3–2. Tile size fits BOTH available axes.

.districts{--block-gap:clamp(.25rem,1.6cqmin,.625rem);--tile:max(2.75rem,min(calc((100cqw - 2 * var(--block-gap)) / 3),calc((100cqh - 2 * var(--block-gap)) / 3),8rem));display:grid;grid-template-columns:repeat(6,calc((var(--tile) - var(--block-gap)) / 2));grid-template-rows:repeat(3,var(--tile));gap:var(--block-gap);width:calc(3 * var(--tile) + 2 * var(--block-gap));height:calc(3 * var(--tile) + 2 * var(--block-gap));place-self:center}
.district{grid-column:span 2;width:100%;aspect-ratio:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.125rem;border:1px solid #92a89b;border-radius:.375rem;background:#f3f5f0;box-shadow:0 .2rem 0 #b4c6ba;text-align:center;overflow:hidden}
.district:nth-child(1){grid-area:1/2/2/4}.district:nth-child(2){grid-area:1/4/2/6;background:#e9eeeb}.district:nth-child(3){grid-area:2/1/3/3}.district:nth-child(4){grid-area:2/3/3/5;background:#405c4d;color:white;border-color:#405c4d;box-shadow:0 .2rem 0 #8ca696}.district:nth-child(5){grid-area:2/5/3/7}.district:nth-child(6){grid-area:3/2/4/4;background:#dae3dd}.district:nth-child(7){grid-area:3/4/4/6;background:#e9eeeb}
.district-top{display:flex;justify-content:center;line-height:1}.district-top svg{width:1rem;height:1rem}.district-code{display:none}.district strong{font-size:.75rem;font-weight:650;line-height:1.2;white-space:nowrap}.district small{display:none;font-size:.75rem;color:#53665c;line-height:1.2;white-space:nowrap}.district.council small{color:#dce8df}
@container (min-width:16rem) and (min-height:16rem){.district{padding:.25rem}.district strong{font-size:.875rem}.district small{display:block}.district-top svg{width:1.125rem;height:1.125rem}}
.live-expand{display:none}.live-collapse{display:grid;place-items:center;min-width:2.75rem;min-height:2.75rem;border:0;border-radius:.375rem;background:transparent;font-size:1.25rem}.live-collapse:hover{background:var(--soft)}
.social{grid-area:social;z-index:2;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:.5rem .75rem;gap:.25rem;overflow:hidden}.social span{display:block;line-height:1.15;font-size:.875rem;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;width:100%}.social b{font-weight:650}.primary-nav{grid-area:nav;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.125rem;padding:.25rem}.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;border:0;border-radius:.5rem;background:transparent;min-height:2.75rem;padding:.125rem;font-size:.875rem;white-space:nowrap}.nav-btn[aria-current="page"]{background:var(--ink);color:white}.nav-btn svg{width:1.125rem;height:1.125rem}
/* Dialogs intentionally scroll internally; the hub remains one screen. */
dialog{padding:0;border:1px solid #aab9b1;border-radius:1rem;background:var(--paper);color:var(--ink);width:min(42rem,calc(100% - 2 * var(--pad)));max-width:100%;max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2 * max(1rem,env(safe-area-inset-top),env(safe-area-inset-bottom)));overflow:hidden;box-shadow:0 1rem 4rem #182a2a33}dialog[open]{display:flex;flex-direction:column;animation:sheet-in var(--speed) var(--ease)}dialog::backdrop{background:#1d292b70;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;border-bottom:1px solid var(--line);gap:.75rem;flex-shrink:0}.dialog-head h2{font-size:1rem}.close-btn{min-height:2.75rem;min-width:2.75rem;border:0;border-radius:.5rem;font-size:1.5rem}.dialog-body{padding:1rem;overflow:auto;overscroll-behavior:contain;min-height:0;line-height:1.65;overflow-wrap:anywhere}.dialog-body p+p{margin-top:.75rem}.dialog-body h3{font-size:1rem;margin:1rem 0 .5rem}.dialog-body h3:first-child{margin-top:0}.dialog-body ul{padding-left:1.25rem}.dialog-body .event-card{width:100%;margin-bottom:.75rem;padding:.75rem}.dialog-body .event-card strong{white-space:normal}.note{font-size:.875rem;color:var(--muted)}.spec-readout{display:flex;flex-wrap:wrap;gap:.5rem;padding:.625rem;background:var(--soft);border-radius:.5rem;font-size:.875rem}.spec-table{width:100%;border-collapse:collapse;font-size:.875rem;table-layout:fixed}.spec-table th,.spec-table td{padding:.625rem .375rem;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}.spec-table th:first-child{width:27%}.spec-table code{font-size:.8125rem}.chat-log{display:flex;flex-direction:column;gap:.75rem;list-style:none;padding:0;margin:0}.chat-log li{background:var(--soft);padding:.625rem .75rem;border-radius:.625rem}.chat-form{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}.chat-form input{flex:1;min-width:8rem;min-height:2.75rem;border:1px solid var(--line);border-radius:.5rem;padding:.5rem}.action{min-height:2.75rem;border-radius:.5rem;padding:.5rem .875rem;background:var(--ink);color:white}.menu-options{display:grid;gap:.5rem;margin-top:1rem}.menu-options button{min-height:2.75rem;border-radius:.5rem}.feedback{margin-top:.75rem;font-size:.875rem}.sample-tag{font-size:.75rem;color:var(--muted)}
.app.is-reflowing{overflow:clip} /* Only during FLIP; ordinary layouts remain unclipped for overflow QA. */

@media (orientation:landscape) and (min-width:36rem){
 :root{--rail:clamp(3.25rem,7vw,4rem);--hud:2.875rem;--gap:clamp(.375rem,1.2vw,.75rem);--social:clamp(3rem,14dvh,3.5rem)}
 .app{min-height:20rem;grid-template-columns:var(--rail) minmax(0,1fr) minmax(0,.7fr) 26%;grid-template-rows:var(--hud) minmax(0,1fr) var(--social);grid-template-areas:"hud hud hud hud" "secondary map map live" "social social nav nav"}
 .identity-copy{flex-direction:row;align-items:center;gap:.375rem}.agent-prefix{display:inline}.hud{padding-block:0;padding-right:calc(3 * 2.75rem + 4 * var(--gap))}.utility{grid-area:hud;flex-direction:row;justify-self:end;align-self:center;margin-right:var(--gap);gap:.25rem}.utility button{min-height:2.75rem;width:2.75rem;border:0;background:transparent;padding:.125rem;font-size:.75rem;gap:.125rem}.utility button{box-shadow:none}.utility button>span{display:none}.utility svg{width:1.25rem;height:1.25rem}.city-map{grid-template-columns:var(--rail) minmax(0,1fr) minmax(0,.7fr) 26%;grid-template-rows:var(--hud) minmax(0,1fr) var(--social)}.map-stage{grid-area:2/2/3/4}.ticker{display:none}.events-panel{height:100%;display:grid;grid-template-rows:2.75rem repeat(3,minmax(2.75rem,1fr));gap:.25rem;padding:.375rem;overflow:auto;overscroll-behavior:contain}.live-heading h2{font-size:.875rem}.live-heading{gap:0}.live.live-is-collapsed{width:var(--rail);align-self:start;justify-self:end}.live-is-collapsed .events-panel{display:none}.live-is-collapsed .live-expand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;width:100%;min-height:3.5rem;border:0;border-radius:inherit;font-size:.75rem}.app.live-collapsed .map-stage{grid-column:2/-1;margin-right:calc(var(--rail) + var(--gap))}
 .rail.secondary button{min-height:2.75rem}.social{padding:.25rem .75rem}.social span:nth-child(n+3){display:none}.primary-nav{padding:.125rem}.nav-btn{gap:.25rem}.nav-btn svg{width:1.25rem;height:1.25rem}
}
/* Short landscape preserves square buildings and all controls. */
@media (orientation:landscape) and (max-height:23rem) and (min-width:36rem){:root{--gap:.375rem;--pad:.5rem}.event-meta{font-size:.75rem}}
@media(max-width:22rem){.stats{gap:.375rem}.stat{font-size:.75rem;gap:.125rem}.stat svg{width:.875rem;height:.875rem}.resource-plus{width:1rem}.hud{padding-inline:.375rem}.avatar{width:1.75rem}.identity{gap:.25rem}}

<dialog id="sheet" aria-labelledby="sheet-title"><header class="dialog-head"><h2 id="sheet-title"></h2><button class="close-btn" aria-label="關閉面板" autofocus>×</button></header><div class="dialog-body" id="sheet-body"></div></dialog>
<template id="spec-template">
 <div class="spec-readout" id="spec-readout" aria-live="polite"></div>
 <h3>Grid v1.4 · 已鎖定</h3><p class="note">所有數值都是 CSS 規則，非指定手機畫布。City Map 是鋪滿視窗的底層，HUD、事件、快捷鍵、聊天與導覽浮在上層。全畫面地圖與浮動 UI 共用自適應 Grid 軌道，不使用硬編碼絕對座標。</p>
 <table class="spec-table"><thead><tr><th>區域</th><th>直屏</th><th>橫屏</th></tr></thead><tbody>
 <tr><th>切換條件</th><td>預設；含寬度不足 36rem 的窄橫屏</td><td>landscape 且 ≥ 36rem（預設字級下 576px）</td></tr>
 <tr><th>浮動 UI Grid</th><td>rail / 1fr / rail；5 列</td><td>rail / 1fr / .7fr / 26%；3 列</td></tr>
 <tr><th>HUD</th><td>高 clamp(3.25rem, 7dvh, 4rem)；頭像在左、VIP 固定於姓名下方</td><td>高 2.875rem（46px）；最右 3 個純圖示工具按鈕，點擊範圍仍為 44px</td></tr>
 <tr><th>外邊距／間距</th><td colspan="2">邊距 clamp(.5rem, 2vw, .875rem)，並取 safe-area 最大值。間距 clamp(.375rem, 1.4vw, .75rem)，橫屏中值 1.2vw。</td></tr>
 <tr><th>按鈕軌道</th><td>寬 clamp(3.25rem, 13vw, 3.75rem)；左右同起點、同間距；按鈕高至少 3.5rem</td><td>左寬 clamp(3.25rem, 7vw, 4rem)；按鈕高至少 2.75rem；工具按鈕在 HUD 水平排列，隱藏文字並保留無障礙名稱</td></tr>
 <tr><th>快捷工具順序</th><td>右側由上而下：Menu／Shop／Mail</td><td>HUD 右側由左至右：Mail／Shop／Menu</td></tr>
 <tr><th>資源入口</th><td colspan="2">體力與資產各在數值右侧加上「＋」；整組資源可點擊，點擊高度至少 44px，開啟補給／資產入口示意。</td></tr>
 <tr><th>熱門事件</th><td>高 2.875rem（含邊框，按鈕 44px），單行輪播；點擊展開三筆</td><td>預設展開，寬為內容區 26%；可收起為右側事件按鈕，再點擊展開。極短橫屏允許事件面板內部捲動</td></tr>
 <tr><th>City Map</th><td>地圖鋪滿 100% 寬 × 100dvh；七棟正方形建築固定 2–3–2 排列，管委會居中</td><td>地圖鋪滿 100% 寬 × 100dvh；七棟正方形建築固定 2–3–2 排列，管委會居中</td></tr>
 <tr><th>建築比例</th><td colspan="2">容器查詢同時取可用寬、高的較小值；每棟 aspect-ratio: 1，三排等高。6 個半欄構成置中的 2–3–2。邊長上限 8rem、下限 2.75rem；縮小時簡化狀態文字，名稱保留。</td></tr>
 <tr><th>Map safe area</th><td colspan="2">地圖地塊延伸至所有浮動 UI 下方與螢幕邊緣；七個可點地標保留在中央安全區，避免被 HUD、軌道、事件或底部 UI 遮擋。安全區不限制地圖本身的尺寸。</td></tr>
 <tr><th>Social Live</th><td>顯示三則；高 4.5rem，底部全寬</td><td>左下顯示前兩則；底列高 clamp(3rem, 14dvh, 3.5rem)。點擊仍展開完整聊天。</td></tr>
 <tr><th>Primary Nav</th><td>高 clamp(3.5rem, 7.5dvh, 4rem)；五等分：大廳／事件／商會／排行／我的</td><td>右下佔後兩欄；五等分，與 Social 同高</td></tr>
 </tbody></table>
 <h3>旋轉、視窗與動態效果</h3><ul><li>使用 100dvh 與安全區；舊瀏覽器回退到 100vh。版型由 CSS media query 即時切換，不依賴 orientationchange。</li><li>跨斷點時，原有區塊依實際前後位置移動並淡入，380ms ease-out；切換期間不停用點擊。</li><li>prefers-reduced-motion: reduce 關閉旋轉、面板與輪播動畫，輪播保持靜止；仍可點開全部事件。</li><li>窄屏最小內容高 34rem，橫屏 20rem。極短視窗／放大字級時允許垂直捲動，以保留功能與點擊範圍；不使用 overflow-x:hidden 掩蓋排版錯誤。</li><li>小尺寸建築省略狀態小字；安全區寬高皆 ≥ 16rem 時顯示。橫屏高度 ≤ 23rem 時，間距 .375rem、邊距 .5rem，仍保留 safe-area。</li><li>輪播每 5 秒換一筆；面板開啟、頁面隱藏、游標停留或鍵盤焦點在輪播時暫停。</li></ul>
 <h3>互動範圍</h3><p class="note">低保真原型，所有事件、資產、倒數與訊息都是示意資料。區域／按鈕提供入口預覽；聊天可在本頁暫存送出，重新整理後清除，沒有對外傳送。</p>
 <h3>目前區域尺寸（CSS px）</h3><div id="region-readout" class="note mono"></div>
</template>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sheet=$('#sheet'),body=$('#sheet-body'),title=$('#sheet-title');
const landscape=matchMedia('(orientation: landscape) and (min-width: 36rem)');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const events=[{title:'BTC 趨勢預測',text:'BTC 趨勢預測開放中 · 1,280 人參與',meta:'1,280 人參與 · 剩餘 18:42',detail:'你認為下一個交易時段的 BTC 趨勢如何？',cta:'加入預測'},{title:'降息觀點 PK',text:'降息觀點 PK · 多 63% / 空 37%',meta:'多 63% · 空 37% · 剩餘 02:15',detail:'看看城市裡的 Agent 如何看待下一次利率決議。',cta:'加入 PK'},{title:'商會週末挑戰',text:'商會週末挑戰 · 32 個商會已加入',meta:'32 商會參戰 · 剩餘 1 天',detail:'與商會夥伴一起完成本週的城市挑戰。',cta:'查看挑戰'}];
const messages=[['Alex','BTC 今晚有機會突破 70K 嗎？'],['CryptoCat','我們準備開團，歡迎加入！'],['MoonKing','恭喜在 ETH 預測中獲勝 +520 USDC！']];
let panelType='',returnFocus=null,index=0,timer=null,pointerPaused=false;
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function showPanel(name,type){returnFocus=sheet.open?returnFocus:document.activeElement;panelType=type;title.textContent=name;body.replaceChildren();$('#ticker').setAttribute('aria-expanded',type==='events'?'true':'false');if(!sheet.open)sheet.showModal();body.scrollTop=0;$('.close-btn').focus();}
function closePanel(){sheet.close();}
$('.close-btn').addEventListener('click',closePanel);
sheet.addEventListener('click',e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePanel();}});
sheet.addEventListener('close',()=>{panelType='';$('#ticker').setAttribute('aria-expanded','false');returnFocus?.focus({preventScroll:true});});
function showEvents(){showPanel('熱門事件 · 3 則','events');events.forEach((item,i)=>{const btn=element('button',undefined,'event-card');btn.append(element('strong',item.title),element('span',item.meta,'note'));btn.addEventListener('click',()=>showEvent(i));body.append(btn);});body.append(element('p','事件、參與人數與倒數皆為示意資料。','note'));}
function showEvent(i){const e=events[i];showPanel(e.title,'event');body.append(element('p',e.meta,'note'),element('p',e.detail));const btn=element('button',e.cta,'action');const feedback=element('p','','feedback');feedback.setAttribute('role','status');btn.style.marginTop='1rem';btn.onclick=()=>{feedback.textContent='已選擇「'+e.cta+'」。此處為流程入口示意，未建立任何交易或報名。';};body.append(btn,feedback);}
$('#ticker').onclick=showEvents;document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>showEvent(Number(b.dataset.event)));
function showChat(){showPanel('世界聊天','chat');const list=element('ul',undefined,'chat-log');list.setAttribute('aria-live','polite');function add(m){const row=element('li');row.append(element('b',m[0]+'：'),document.createTextNode(m[1]));list.append(row);}messages.forEach(add);const form=element('form',undefined,'chat-form');const input=element('input');input.placeholder='輸入訊息…';input.setAttribute('aria-label','聊天訊息');input.maxLength=200;input.required=true;const send=element('button','送出','action');send.type='submit';form.append(input,send);form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const m=['Agent Wayne',text];messages.push(m);add(m);input.value='';list.lastElementChild.scrollIntoView({block:'nearest',behavior:'instant'});input.focus();};body.append(list,form,element('p','僅在此頁暫存，訊息不會對外傳送。','note'));}
$('#open-chat').onclick=showChat;
const descriptions={'體力補給':'目前體力 80 / 100。這裡是體力補給入口，原型不會扣款或改變體力。','增加資產':'目前資產 12,580 USDC。這裡是資產補充入口，原型不會建立充值或交易。','任務':'每日任務 2 / 3：探索城市、參與事件、與商會互動。','七日簽到':'今天是第 3 天；本週已簽到 2 / 7 天。','成就':'城市探索者：已探索 4 / 6 個區域。','Mail':'歡迎來到 AI Tycoon。你的城市旅程從這裡開始。','Shop':'體力補給、造型與城市通行證的入口示意。','預測廣場':'探索世界事件、分享觀點與加入預測。','交易中心':'查看市場與資產的入口示意。','競技場':'加入 1v1、觀點 PK 與賽季挑戰。','商會區':'與商會夥伴一起完成活動。','社交廣場':'認識城市裡的 Agent，參與世界聊天。','娛樂港灣':'探索城市與期間活動。','商會':'商會活動、成員與本週挑戰入口。','管委會':'城市管理與公共事務入口。管委會位於七棟建築的正中央。','排行':'本週排行：01 MoonKing · 02 CryptoCat · 03 Agent Wayne。','我的':'Agent Wayne · VIP 3。個人資料與資產管理入口。'};
function showInfo(name){showPanel(name,'info');if(name==='Menu'){body.append(element('p','AI Tycoon · 城市大廳'));const options=element('div',undefined,'menu-options');[['版型規格 Spec',showSpec],['完整聊天',showChat],['熱門事件',showEvents]].forEach(([label,fn])=>{const b=element('button',label);b.onclick=fn;options.append(b);});body.append(options);}else{body.append(element('p',descriptions[name]||'此功能為入口預覽。'),element('p','低保真原型 · 示意資料','note'));}}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>showInfo(b.dataset.panel));
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const n=b.dataset.nav;if(n==='大廳'){if(sheet.open)closePanel();return;}if(n==='事件')showEvents();else showInfo(n);});
function showSpec(){showPanel('Layout Spec · v1.4','spec');body.append($('#spec-template').content.cloneNode(true));updateSpec();}
function setLiveCollapsed(collapsed){
 $('#hub').classList.toggle('live-collapsed',collapsed);
 $('.live').classList.toggle('live-is-collapsed',collapsed);
 $('#expand-live').setAttribute('aria-expanded',String(!collapsed));
 $('#collapse-live').setAttribute('aria-expanded',String(!collapsed));
 (collapsed?$('#expand-live'):$('#collapse-live')).focus({preventScroll:true});
 reflow(true);
}
$('#collapse-live').onclick=()=>setLiveCollapsed(true);
$('#expand-live').onclick=()=>setLiveCollapsed(false);
function updateSpec(){if(panelType!=='spec')return;$('#spec-readout').textContent=`${landscape.matches?'橫屏':'直屏／窄屏'} · ${innerWidth} × ${innerHeight} · 動畫${reduced.matches?'關閉':'開啟'}`;$('#region-readout').replaceChildren(...Array.from(document.querySelectorAll('[data-motion], [data-region]'),el=>{const r=el.getBoundingClientRect();return element('div',`${el.dataset.motion||el.dataset.region}: ${Math.round(r.width)} × ${Math.round(r.height)}`);}));}
function setupTicker(){clearInterval(timer);if(reduced.matches)return;timer=setInterval(()=>{if(document.hidden||sheet.open||pointerPaused||$('#ticker').contains(document.activeElement)||landscape.matches)return;index=(index+1)%events.length;$('#ticker-copy').textContent=events[index].text;$('#ticker-index').textContent=`${index+1} / 3`;$('#ticker-copy').animate([{opacity:0,transform:'translateY(.3rem)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'ease-out'});},5000);}
$('#ticker').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')pointerPaused=true;});$('#ticker').addEventListener('pointerleave',()=>pointerPaused=false);setupTicker();
const utility=$('.utility');
const utilityButtons=Object.fromEntries([...utility.querySelectorAll('button[data-panel]')].map(button=>[button.dataset.panel,button]));
function syncUtilityOrder(){
 const focused=document.activeElement;
 const order=landscape.matches?['Mail','Shop','Menu']:['Menu','Shop','Mail'];
 for(const key of order)utility.append(utilityButtons[key]);
 if(utility.contains(focused))focused.focus({preventScroll:true});
}
syncUtilityOrder();
/* FLIP: same DOM and focus across layouts. Measurements are animation-only;
   no computed position is persisted to CSS layout or used as a device breakpoint. */
const moving=[...document.querySelectorAll('[data-motion]')];let rects=new Map(),mode=landscape.matches,frame=0;
function measure(){return new Map(moving.map(el=>[el,el.getBoundingClientRect()]));}rects=measure();
let motionGeneration=0;
function reflow(force=false){
 const hub=$('#hub');
 if((landscape.matches!==mode||force===true)&&!reduced.matches)hub.classList.add('is-reflowing');
 cancelAnimationFrame(frame);
 frame=requestAnimationFrame(()=>{
  const nextMode=landscape.matches,changed=nextMode!==mode||force===true,before=rects;
  if(changed){moving.forEach(el=>el.getAnimations().forEach(a=>a.cancel()));syncUtilityOrder();}
  const after=measure();
  if(changed&&!reduced.matches){
   const generation=++motionGeneration;
   const animations=moving.map(el=>{const a=before.get(el),b=after.get(el);const dx=a.left-b.left,dy=a.top-b.top;return el.animate([{transform:`translate(${dx}px,${dy}px)`,opacity:.55},{transform:'translate(0,0)',opacity:1}],{duration:380,easing:'cubic-bezier(.22,.8,.24,1)'});});
   Promise.allSettled(animations.map(a=>a.finished)).then(()=>{if(generation===motionGeneration){hub.classList.remove('is-reflowing');rects=measure();updateSpec();}});
  }else if(!moving.some(el=>el.getAnimations().length)){hub.classList.remove('is-reflowing');}
  mode=nextMode;
  if(changed||!moving.some(el=>el.getAnimations().length))rects=after;
  updateSpec();
 });
}
window.addEventListener('resize',reflow);landscape.addEventListener('change',reflow);window.visualViewport?.addEventListener('resize',reflow);reduced.addEventListener('change',()=>{if(reduced.matches)document.getAnimations().forEach(a=>a.cancel());setupTicker();updateSpec();});
</script>
